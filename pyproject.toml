[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "causalbase"
# Read from `causalbase.__version__`, so the package and its metadata agree.
dynamic = ["version"]
description = "Bayesian network structure learning and causal discovery: GES, XGES, order search, hill climbing and exact search"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Pablo Torrijos", email = "pablo.torrijos@uclm.es" },
  { name = "José A. Gámez" },
  { name = "José M. Puerta" },
]
keywords = [
  "causal discovery",
  "structure learning",
  "bayesian networks",
  "greedy equivalence search",
  "BDeu",
  "order search",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  # llvmlite comes with numba at the version numba pins; it is named because
  # the BDeu kernels import it directly, for the popcount intrinsic.
  "llvmlite",
  "numba>=0.59",
  "numpy>=1.24",
  "pandas>=2.0",
  # Pure-Python, dependency-free shim: supplies `typing.Self` on Python 3.10,
  # where it isn't in the stdlib yet.
  "typing_extensions>=4.0",
]

[project.urls]
Homepage = "https://github.com/ptorrijos99/causalbase"
Documentation = "https://ptorrijos99.github.io/causalbase/"
Issues = "https://github.com/ptorrijos99/causalbase/issues"
Changelog = "https://github.com/ptorrijos99/causalbase/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "hypothesis>=6",
  # Pinned: the formatter's output changes between minor releases, so an
  # unpinned range turns a ruff upgrade into a red build nobody asked for.
  "ruff>=0.16,<0.17",
  "mypy>=1.10,<3",
  "pandas-stubs>=2.0",
  "pre-commit",
]
# The ILP of causalbase.exact under a parent limit.
exact = ["pyscipopt>=5"]
docs = [
  "sphinx>=7",
  "pydata-sphinx-theme>=0.15",
  "numpydoc>=1.6",
  "sphinx-gallery>=0.15",
  "sphinx-design>=0.5",
  "myst-parser>=2",
  "sphinx-copybutton>=0.5",
  # sphinx-gallery imports it even when no example draws a figure.
  "matplotlib",
]
[tool.hatch.version]
path = "src/causalbase/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/causalbase"]
# The bundled networks are package data, so they must be named or the wheel
# ships loaders with nothing to load.
artifacts = ["src/causalbase/datasets/data/*.xbif", "src/causalbase/datasets/data/*.csv.gz"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "SIM", "D"]
ignore = ["D105", "D107"]
pydocstyle.convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# Gallery scripts: the module docstring is the page's reStructuredText intro,
# and sphinx-gallery wants imports in the cell that first uses them.
"examples/**" = ["D", "E402", "B018"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# numba and llvmlite ship no type stubs; scikit-learn and pyscipopt are optional and untyped.
module = ["llvmlite.*", "numba.*", "pyscipopt.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The compiled kernels are numba functions; their numpy indexing is untyped. The
# other modules listed keep their numba kernels next to the Python code that calls them.
module = [
    "causalbase.*._kernels",
    "causalbase.exact.dp",
    "causalbase.exact.ilp",
    "causalbase.scores._compiled",
    "causalbase.search.hill_climb",
]
disallow_untyped_decorators = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
